schema: bauer.architecture/v1
id: memory-consolidation-loop
status: decided_build_in_plan_065
plan: "017"
updated: "2026-11-09"
build_plan: "065"

summary: >-
  Design-only spike for turning finished SQLite sessions into durable semantic
  memory and for promoting repeated human feedback into reviewable directives.
  The scope decision was taken on 2026-11-09 (workspace_only, see `decision:`);
  the build runs in plan 065, sprints 65-68 (slices 0-3).

evidence:
  feedback_capture:
    source: bauer/agent.py:3624-3677  # re-verified 2026-11-09 (was 5022-5077)
    current_behavior:
      - '"/thumbsup" and "/thumbsdown" read the latest user and assistant messages.'
      - 'FEEDBACK.md receives only rating, model, machine_id, and truncated question/answer.'
      - 'DecisionMemory receives a good/bad outcome for the latest session decision.'
      - 'skill_stats receives a best-effort rating for the last injected skill.'
    limitation: >-
      There is no stable pattern fingerprint, tenant/company identifier, full-turn
      provenance, or explicit approval queue in the feedback record.
  durable_memory:
    source: bauer/memory_provider.py:172-255  # re-verified 2026-11-09
    current_behavior:
      - LocalMemoryProvider reads workspace/memory/*.md and injects a 2000-character block.
      - MemoryManager appends timestamped Markdown entries (bauer/memory_manager.py:109-145).
      - The nudge mechanism asks the model to write memory; it is not a consolidator.
  episodic_store:
    source: bauer/sqlite_session_store.py:110-127  # re-verified 2026-11-09
    current_behavior:
      - sessions is keyed only by session_id and stores timestamps, count, and summary.
      - messages stores role/content/index/timestamp and is FTS5/vector indexed.
      - There is no company_id, user_id, agent_id, or consolidated_at column.
  runtime_memory:
    source: bauer/core/runtime/memory.py:14,42-122  # re-verified 2026-11-09
    current_behavior:
      - RuntimeMemoryManager supports user/company/project/agent/skill scopes.
      - It is a separate JSONL backend and is not automatically injected by the agent loop.
  memory_injection:
    source: bauer/agent.py:2851-2868, bauer/memory_facade.py:49-85
    current_behavior:
      - The memory block is built once at session start (prefetch + system_prompt_block).
      - UnifiedMemory.on_turn_start searches every MEMORY_FILES entry but does not re-inject.
  later_changes_reused:
    - "bauer/privacy.py:68-112 redact_text/redact_data (plan 064) for redaction before distillation."
    - "bauer/secrets_scanner.py:139 has_secrets to drop records that still look sensitive."
    - "bauer/session_ids.py:26 validate_session_id (sprint 59) for every session id read from feedback/ledger."
    - "bauer/confined_files.py:69 write_text_atomic (sprint 59) for atomic, symlink-safe Markdown and JSON writes."
    - "bauer/core/runtime/agno_evals.py:164-260 (sprint 56) scope + expiry pattern for decision memory, mirrored by directives."
    - "bauer/core/kernel/entry.py:54 run_governed for the scheduled run (kill-switch, policy, budget)."
  scheduling:
    source: bauer/commands/cron_cmd.py:14-203, bauer/automation_scheduler.py:26-131  # re-verified 2026-11-09
    current_behavior:
      - Durable cron can enqueue and run a scheduled task.
      - A consolidator should be an explicit task/command first, then an opt-in cron job.
  auxiliary_model:
    source: bauer/config_loader.py:1013-1060  # re-verified 2026-11-09
    current_behavior:
      - auxiliary.compression_model is the existing auxiliary slot.
      - A dedicated consolidation_model is not yet defined.

stop_condition:
  triggered: true
  reason: >-
    The session store has no tenant identity while runtime memory already exposes
    a company scope. Consolidating workspace/session data into a company-scoped
    directive would therefore have ambiguous ownership and a cross-company leak risk.
  scope_options:
    - id: workspace_only
      description: >-
        Consolidate only into the current workspace/project memory. No cross-workspace
        or company promotion; safest first slice and requires no session migration.
      tradeoff: >-
        Shared user/company preferences remain unavailable until an identity contract exists.
    - id: explicit_company
      description: >-
        Add company_id to session, feedback, and consolidation provenance, then enforce
        company filtering before any read or write.
      tradeoff: >-
        Requires schema migration, caller propagation, access-control tests, and a
        defined behavior for historical rows with no company_id.
    - id: user_and_project
      description: >-
        Promote only user/project memories; keep company scope manual through
        RuntimeMemoryManager until multi-tenant identity is implemented.
      tradeoff: >-
        Avoids leakage but duplicates some knowledge between projects.
  decision_required: >-
    Choose one scope before implementation. Recommended initial choice is
    user_and_project (or workspace_only for a minimal MVP), with company scope
    explicitly rejected until identity propagation is complete.
  resolved: true
  resolved_at: "2026-11-09"

decision:
  taken_at: "2026-11-09"
  taken_by: "coordinator, by delegation of the user"
  scope: workspace_only
  details:
    - >-
      Consolidate only into the current workspace memory: the MemoryManager Markdown
      files under <workspace>/memory/ that LocalMemoryProvider injects. Scope id is
      "ws-" + sha256(normcase(resolved workspace path))[:16] (bauer/memory_scope.py).
    - company scope is explicitly rejected until an identity contract exists.
    - user scope is deferred (sessions have no user_id).
    - >-
      Sessions without verifiable workspace provenance (historic rows, rows saved by a
      store without workspace, rows saved from two different workspaces) are never
      consolidated (fail closed). Slice 0 stamps provenance on new sessions and feedback.
    - Opt-in per workspace, off by default.
    - >-
      Never consolidate secrets, credentials, tokens or provider payloads: tool/system
      messages are excluded, text is redacted with privacy.redact_text before
      distillation, and records that still look sensitive are dropped.
    - Raw episodic sessions are not deleted or altered by consolidation.
    - >-
      Failed/partial runs retry on the next run within budget; idempotent via a ledger
      keyed by session_id + scope; records are written atomically before the session is
      marked consolidated.
    - >-
      Each feedback-derived directive is approved individually, never auto-activated,
      has expiry and revoke, and keeps provenance to the supporting feedback.
    - machine_id does not partition (scope is the workspace); it stays as metadata.
    - >-
      Consolidated facts carry provenance ("consolidado de sessão X em DATA"),
      confidence and valid_until, live in CONSOLIDATED.md and are editable/removable
      with the existing bauer memory md tooling.
    - LLM is auxiliary.compression_model; no new config field.

pipeline_after_scope_decision:
  trigger: "manual bauer memory consolidate [first]; opt-in cron later"
  selection:
    - select closed sessions older than a configurable age
    - exclude sessions already marked consolidated
    - enforce the selected scope before reading or writing
    - redact secrets, credentials, tokens, and provider payloads
  distillation:
    model: "auxiliary.compression_model initially; dedicated consolidation_model later"
    output:
      - atomic fact/preference/lesson records
      - source session ids and consolidation timestamp
      - confidence and valid_until
      - review_required: true for user-facing directives
  write_path:
    - "MemoryManager Markdown for the currently injected project memory"
    - "RuntimeMemoryManager only when its explicit scope/id contract is supplied"
  idempotency:
    - add a consolidation ledger keyed by session_id plus scope
    - write records atomically before marking the source window complete
    - retry safely without duplicating facts

feedback_schema:
  required_fields:
    - rating
    - session_id
    - turn_index
    - user_message_digest
    - assistant_message_digest
    - model
    - machine_id
    - scope
    - created_at
  promotion_rule:
    - group only by a stable fingerprint within the same scope
    - require at least 3 negative signals across 2 distinct sessions
    - apply temporal decay after 30 days
    - create a draft "avoid/prefer" directive, never activate automatically
    - require explicit user approval before prompt injection
    - support revoke, expiry, and provenance back to all supporting feedback

build_slices:
  - id: 0
    name: enrich_feedback_and_scope_contract
    deliverable: >-
      Persist full-turn provenance, digest, session/scope identity, and a redaction
      decision; add tests proving company boundaries cannot be crossed.
  - id: 1
    name: manual_batch_consolidator
    deliverable: >-
      Add bauer memory consolidate with dry-run, budget, deterministic ledger,
      review output, and no automatic prompt activation.
  - id: 2
    name: opt_in_scheduled_consolidation
    deliverable: >-
      Run the approved batch through the durable cron/runtime scheduler with
      kill-switch, per-day token budget, metrics, and retry/backoff.
  - id: 3
    name: feedback_directives
    deliverable: >-
      Fingerprint repeated feedback, generate reviewable directives, and activate
      only after explicit human approval with expiry/revocation.

open_questions:
  - question: Is consolidation opt-in per installation, workspace, or company?
    answer: Per workspace, off by default (memory/consolidation/settings.json).
  - question: Which identity source supplies user_id and company_id for CLI, serve, and desktop?
    answer: >-
      None yet. company is rejected and user deferred; the only identity used is the
      workspace scope id. Revisit when an identity contract exists.
  - question: What data must never be consolidated (secrets, credentials, regulated/company data)?
    answer: >-
      Secrets, credentials, tokens and provider payloads. Only user/assistant text is
      read, redacted before distillation, and any record still flagged by the secrets
      scanner is dropped. Company data is out of scope with the company scope.
  - question: How long are raw episodic sessions retained after successful consolidation?
    answer: Unchanged. Consolidation never deletes or edits sessions.
  - question: Should a failed or partial consolidation be retried automatically, and under what budget?
    answer: >-
      Yes, on the next run (manual or scheduled), counted against the run budget and,
      when scheduled, the per-day token budget, with exponential backoff between
      failed scheduled runs and a per-session attempt cap.
  - question: Does the user approve each directive or only a batch of proposed directives?
    answer: Each directive individually (bauer memory directives approve <id>).
  - question: How are model-generated facts corrected, expired, and audited?
    answer: >-
      Facts live in CONSOLIDATED.md with provenance, confidence and valid_until;
      expired entries stop being injected; the file is edited/cleaned with
      bauer memory md; the ledger records which sessions produced which records.
  - question: Should machine_id partition feedback, or may the same user span machines?
    answer: It does not partition; the workspace is the scope. machine_id stays as metadata.
