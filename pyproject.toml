[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bauer-agent"
version = "0.9.0b1"
description = "Runtime adaptativo para LLMs locais — sobe com o que tem, ajusta o que precisa, avisa claramente."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Henrique Ferraz Moura" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "psutil>=5.9",
    "prompt-toolkit>=3.0",
    "cryptography>=41.0",
]

[project.optional-dependencies]
keychain = [
    "keyring>=24.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    # -n auto no addopts: a suite serial leva 349s, paralela ~75s. O gate de
    # testes do Kernel roda `python -m pytest` no projeto e herda o addopts —
    # sem isto, cada run autonomo aqui dentro pagaria ~6min de verificacao.
    "pytest-xdist>=3.5",
    "mypy>=1.11",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
]
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]
gateway = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
]
web = [
    "ddgs>=6.0",             # DuckDuckGo (MIT) — busca web geral open-source
    "beautifulsoup4>=4.12",  # extração de conteúdo limpo no web_fetch
]
voice = [
    # STT local offline — pesos open-source do Whisper (large-v3-turbo) via
    # CTranslate2. Sem nuvem, sem API key. Baixa ~1.5GB no primeiro uso.
    "faster-whisper>=1.0.0",
]
all = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "ddgs>=6.0",
    "beautifulsoup4>=4.12",
    "faster-whisper>=1.0.0",
]

[project.scripts]
bauer = "bauer.cli:app"

[tool.setuptools.packages.find]
include = ["bauer*"]
exclude = ["tests*", "memory*", "workspace*", "logs*"]

[tool.setuptools.package-data]
bauer = [
    "*.yaml", "*.json", "py.typed",
    # Dados embutidos: skills do hub + templates da App Factory (Spec-Driven).
    # Inclui dotfiles (.env.example) e extensões variadas (.md/.yml) em subdirs.
    "data/**/*.yaml", "data/**/*.yml", "data/**/*.json", "data/**/*.md",
    "data/app_factory/templates/.env.example",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -n auto"
asyncio_mode = "auto"

[tool.ruff.lint]
# Selecao de regras versionada aqui para manter CI e editor em sincronia.
# Bloqueante no CI (job lint-critical): E9, F63, F7, F82
# Informativo no CI (job lint): E, F, W com as excecoes abaixo
select = ["E", "F", "W"]
# E501: linhas longas — aceito no projeto (cli.py/tool_router.py tem linhas necessariamente longas)
# W291/W293: trailing whitespace — ruido sem impacto funcional
# E302/E303: blank lines — nao seguimos PEP8 rigido aqui
ignore = ["E501", "W291", "W293", "E302", "E303"]

[tool.mypy]
# O pacote publica `py.typed` — isso PROMETE tipos corretos a quem consome a
# biblioteca, e nada verificava essa promessa. Estado inicial medido: 356 erros
# em 80 dos 293 modulos. Consertar tudo de uma vez nao e "adicionar mypy ao CI",
# e outro projeto; o desenho aqui e uma CATRACA.
#
# Regra: TUDO e verificado por padrao. Os 80 modulos com divida estao listados
# explicitamente abaixo com ignore_errors. Consequencias, ambas desejadas:
#   - modulo NOVO ja nasce verificado (nao ha como adicionar divida em silencio);
#   - a lista so pode ENCOLHER — tirar um nome de la e o passo de quitacao.
#
# 213 modulos / 48.273 LOC (52% do codigo) ja passam limpos e estao travados.
#
# COMO REGERAR A LISTA DE DIVIDA — use o MESMO ambiente do CI:
#     pip install -e ".[dev]"     (nao o python do sistema!)
#     mypy bauer/
# Aprendido na marra: a primeira versao desta lista foi medida com o python do
# sistema (pydantic 2.9.2) enquanto o CI instala o extra `dev` (pydantic
# 2.13.4). As libs mudam os proprios stubs entre versoes, entao um modulo pode
# passar num ambiente e falhar no outro — foi exatamente o que aconteceu com
# config_loader.py.
python_version = "3.11"
ignore_missing_imports = true       # deps opcionais (fastapi, playwright, ddgs...)
follow_imports = "silent"           # nao propaga erro de modulo com divida
warn_unused_configs = true
# Deliberadamente NAO ligados nesta fase — cada um sozinho reintroduz centenas
# de erros nos modulos hoje limpos, o que derrubaria a catraca no primeiro dia:
#   disallow_untyped_defs, disallow_any_generics, strict_optional estrito.
# Sao os proximos degraus, um por PR.

[[tool.mypy.overrides]]
# Libs de terceiros que NAO devem ser analisadas. numpy (puxado por extras de
# audio/voz em venvs locais, nao pelo extra `dev` do CI) publica stubs com
# `type X = ...`, sintaxe de Python 3.12+ — com python_version=3.11 o mypy
# aborta com erro de SINTAXE no stub e para de checar o resto. O CI nao tinha
# numpy e passava; a maquina do dev tinha e nao rodava. skip evita a
# divergencia dos dois lados.
module = ["numpy"]
follow_imports = "skip"
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
# ── REGISTRO DE DIVIDA DE TIPAGEM ─────────────────────────────────────────────
# Cada nome aqui e um modulo que ainda nao passa no mypy. NAO ADICIONE NOMES.
# Para quitar: remova o modulo da lista, rode `mypy bauer/` e conserte o que
# aparecer. Ordem sugerida (maior retorno primeiro): os modulos que outros
# importam muito — tool_router, auth, config-adjacentes — antes dos god objects
# (agent.py, server.py, cli.py), que sao dificeis por serem grandes, nao por
# serem centrais.
module = [
    "bauer.agent",
