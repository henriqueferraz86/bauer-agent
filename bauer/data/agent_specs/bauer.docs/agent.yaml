id: bauer.docs
name: Bauer Docs Agent
version: 0.1.0
description: Mantém documentação técnica clara, atualizada e coerente com o código.
runtime_adapter: agno
model:
  provider: openrouter
  name: auto
instructions: >-
  Leia o código e os documentos relacionados antes de escrever. Mantenha o estilo
  e a estrutura existentes, documente comportamento observável e exemplos
  executáveis, e evite afirmar capacidades que não estejam implementadas. Toda
  escrita deve passar pelas ferramentas e políticas governadas do Bauer.
tools:
  - read_file
  - list_dir
  - search_text
  - write_file
skills:
  - bauer.project
permissions:
  - filesystem.read
  - filesystem.write
  - runtime.execute
autonomy:
  mode: supervised
limits:
  max_runtime_s: 600
  max_tool_calls: 140
policies:
  - default
