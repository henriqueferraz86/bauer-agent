services:

  # ── Ollama — interno, nunca exposto para fora ──────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: bauer-ollama
    volumes:
      - ollama_models:/root/.ollama        # modelos persistem entre restarts
    # SEM ports: — Ollama só é acessível internamente via rede Docker
    environment:
      # Descarrega o modelo da RAM imediatamente após cada resposta.
      # Essencial para CPU/baixa RAM: só 1 modelo ocupa memória por vez.
      # Com GPU, mude para "5m" (cache quente entre chamadas).
      - OLLAMA_KEEP_ALIVE=0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    # ── GPU NVIDIA: descomente para usar CUDA ──────────────────────────────
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ── Init — baixa os modelos na primeira vez (sai após concluir) ───────────
  ollama-init:
    image: ollama/ollama:latest
    container_name: bauer-ollama-init
    volumes:
      - ollama_models:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: >
      sh -c "
        echo '==> Baixando modelos...' &&
        ollama pull qwen3:0.6b &&
        ollama pull phi4-mini &&
        ollama pull Impulse2000/smollm3 &&
        echo '==> Modelos prontos.'
      "
    restart: "no"

  # ── Bauer Agent — único ponto de entrada externo ───────────────────────────
  bauer:
    build: .
    container_name: bauer-agent
    env_file:
      - path: .env
        required: false
    volumes:
      # A sintaxe longa impede que Docker Desktop crie um diretório quando o
      # arquivo de origem estiver ausente (comum em instalações no Windows).
      - type: bind
        source: ./config.yaml
        target: /app/config.yaml
        # O painel web persiste toggles e alvos em continuous_autonomy.
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: ./models.yaml
        target: /app/models.yaml
        read_only: true
        bind:
          create_host_path: false
      # A autonomia usa apenas a CLI para sondar/iniciar/reiniciar alvos.
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
      - bauer_workspace:/app/workspace
      - bauer_memory:/app/memory
      - bauer_logs:/app/logs
    ports:
      - "8000:8000"                        # único serviço exposto
      - "127.0.0.1:1455:1455"              # callback local do login OpenAI/ChatGPT
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_HOST=http://ollama:11434    # Ollama interno
      - BAUER_HOME=/app/memory/bauer-home # tokens OAuth persistem no volume
      - BAUER_SERVE_TURN_TIMEOUT=3600 # limite do stream: 60 minutos
      - BAUER_OAUTH_CALLBACK_HOST=0.0.0.0 # publicado só no loopback do host
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── AgentOS — superfície Agno sobre o catálogo formal do Bauer ────────────
  # É um processo separado do servidor governado do Bauer (porta 8000).
  agentos:
    build: .
    container_name: bauer-agentos
    env_file:
      - path: .env
        required: false
    volumes:
      - type: bind
        source: ./config.yaml
        target: /app/config.yaml
        # O AgentOS também compartilha o estado editável de autonomia.
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: ./models.yaml
        target: /app/models.yaml
        read_only: true
        bind:
          create_host_path: false
      - bauer_workspace:/app/workspace
      - bauer_memory:/app/memory
      - bauer_logs:/app/logs
    ports:
      - "7777:7777"
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_HOST=http://ollama:11434
      - BAUER_CONFIG=/app/config.yaml
      - BAUER_WORKSPACE=/app/workspace
      - BAUER_RUNTIME_ROOT=/app/memory/runtime
      - BAUER_HOME=/app/memory/bauer-home
      - AGENT_OS_HOST=0.0.0.0
      - AGENT_OS_PORT=7777
      - AGENT_OS_CORS_ORIGINS=${AGENT_OS_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    command: ["python", "-m", "bauer.agentos_app"]
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7777/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # ── Agent UI oficial do Agno — construído do repositório upstream ─────────
  agent-ui:
    build:
      context: ./agent-ui
      args:
        AGENT_UI_REF: ${AGENT_UI_REF:-main}
        AGENT_UI_ENDPOINT: ${AGENT_UI_ENDPOINT:-http://localhost:7777}
    container_name: bauer-agent-ui
    ports:
      - "3000:3000"
    depends_on:
      agentos:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped

volumes:
  ollama_models:      # modelos Ollama (~6 GB com os 3 modelos)
  bauer_workspace:
  bauer_memory:
  bauer_logs:
